name: Validate Skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Agent Skills Spec & Repo Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      - name: Check plugin version sync
        run: node scripts/sync-plugin-version.mjs --check

      - name: Validate skills
        run: bash scripts/validate-skills.sh
